<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#10131b"><title>Bubu & Dudu: Rescue Mission — Test</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#0b0e15;color:#f4f0e8;font-family:system-ui,-apple-system,Segoe UI,sans-serif;touch-action:none}
#app{height:100dvh;display:flex;flex-direction:column;background:radial-gradient(ellipse at 50% 25%,#29313a 0,#111720 48%,#080b11 100%)}
header{height:58px;flex:none;display:flex;align-items:center;justify-content:space-between;padding:0 15px;border-bottom:1px solid #ffffff18;background:#0b0e15bb}
.brand{font-weight:800;font-size:13px;letter-spacing:.08em}.brand small{display:block;color:#aab1bd;font-size:9px;font-weight:500;letter-spacing:.2em}
#hud{display:flex;gap:12px;font-size:11px;color:#d7dbe1}#hud b{color:#f4d28b}
#stage{position:relative;flex:1;min-height:0;overflow:hidden}
canvas{width:100%;height:100%;display:block}
#hint{position:absolute;left:50%;top:12px;transform:translateX(-50%);background:#0a0d14b8;border:1px solid #ffffff22;border-radius:20px;padding:7px 12px;font-size:10px;color:#d7dbe1;white-space:nowrap;pointer-events:none}
#controls{height:132px;flex:none;display:flex;justify-content:center;align-items:center;padding:8px 16px calc(12px + env(safe-area-inset-bottom));background:linear-gradient(#10151dcc,#080b11);border-top:1px solid #ffffff18}
#stick{width:116px;height:116px;border-radius:50%;border:2px solid #ffffff55;background:radial-gradient(circle,#34414d,#151c25);position:relative;touch-action:none;box-shadow:0 5px 18px #0009}#knob{position:absolute;width:48px;height:48px;left:32px;top:32px;border-radius:50%;background:linear-gradient(145deg,#c6d0d7,#64727e);border:2px solid #ffffff99;pointer-events:none}
#overlay{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;background:#080b11c9;backdrop-filter:blur(5px);padding:24px}
.panel{width:min(340px,100%);padding:24px 20px;border:1px solid #ffffff28;border-radius:22px;background:linear-gradient(150deg,#252d38,#111720);text-align:center;box-shadow:0 20px 70px #000a}
.panel h1{font-size:22px;line-height:1.15;margin:0 0 10px}.panel p{font-size:12px;line-height:1.6;color:#c1c8d1;margin:0 0 18px}
.primary{border:0;border-radius:12px;padding:13px 25px;background:linear-gradient(120deg,#d4ad72,#9c7544);color:#15120e;font-weight:900;letter-spacing:.08em}
.note{font-size:10px;color:#9aa5b2;margin-top:13px}
@media(min-width:700px){#app{max-width:460px;margin:auto;border-left:1px solid #ffffff18;border-right:1px solid #ffffff18}}
</style></head>
<body><div id="app">
<header><div class="brand">BUBU & DUDU <small>RESCUE MISSION · TEST BUILD</small></div><div id="hud"><span>LEVEL <b>01 / 10</b></span><span>❤ <b id="lives">3</b></span><button id="audio">♫ SOUND ON</button></div></header>
<main id="stage"><canvas id="game"></canvas><div id="hint">Find the switch. Open the way to bubu.</div>
<div id="overlay"><div class="panel"><h1>Rescue Mission</h1><p>dudu has reached the abandoned forest station. Find the hidden switch, avoid the broken floor and rescue bubu.</p><button class="primary" id="start">START LEVEL 1</button><div class="note">Prototype · Mobile controls · No purchases</div></div></div></main>
<section id="controls"><div id="stick" role="button" aria-label="Move: drag left or right; jump: push joystick upward"><div id="knob"></div></div></section>
</div>
<script>
(()=> {
const canvas=document.getElementById('game'),ctx=canvas.getContext('2d'),stage=document.getElementById('stage');
let W=0,H=0,scale=1,started=false,won=false,dead=false,lives=3,cam=0,frame=0;
const keys={left:false,right:false};let jumpQueued=false;
let audioCtx=null,audioOn=false,audioTimer=null;
function startMusic(){if(audioOn)return;const AC=window.AudioContext||window.webkitAudioContext;if(!AC)return;audioCtx=new AC();audioCtx.resume();audioOn=true;document.getElementById('audio').textContent='♫ SOUND ON';const master=audioCtx.createGain();master.gain.value=.30;master.connect(audioCtx.destination);const low=audioCtx.createBiquadFilter();low.type='lowpass';low.frequency.value=850;low.connect(master);function note(freq,dur,when,vol){const o=audioCtx.createOscillator(),g=audioCtx.createGain();o.type='triangle';o.frequency.setValueAtTime(freq,when);g.gain.setValueAtTime(.0001,when);g.gain.linearRampToValueAtTime(vol,when+.8);g.gain.exponentialRampToValueAtTime(.0001,when+dur);o.connect(g);g.connect(low);o.start(when);o.stop(when+dur+.1)}const seq=[110,164.81,130.81,196,98,146.83,123.47,185];let n=0;function phrase(){if(!audioOn)return;let t=audioCtx.currentTime;note(seq[n%8],5,t,.25);note(seq[(n+2)%8]*2,3,t+1.4,.075);note(seq[(n+4)%8]*1.5,4,t+2.8,.06);n++;audioTimer=setTimeout(phrase,5200)}phrase()}
document.getElementById('audio').onclick=()=>{if(!audioOn){startMusic()}else{audioOn=false;clearTimeout(audioTimer);if(audioCtx)audioCtx.suspend();document.getElementById('audio').textContent='♫ SOUND OFF'}};
const world={width:1900,ground:0,platforms:[{x:0,y:0,w:430,h:70},{x:520,y:0,w:360,h:70},{x:1000,y:0,w:900,h:70},{x:310,y:-105,w:130,h:18},{x:650,y:-145,w:150,h:18},{x:1120,y:-105,w:180,h:18}],switch:{x:360,y:-35,on:false},door:{x:1510,y:-145,open:false},bubu:{x:1760,y:-74,rescued:false}};
const player={x:90,y:-76,vx:0,vy:0,w:42,h:58,grounded:false,face:1};
function resize(){const r=stage.getBoundingClientRect();W=r.width;H=r.height;const d=Math.min(devicePixelRatio||1,2);canvas.width=Math.floor(W*d);canvas.height=Math.floor(H*d);ctx.setTransform(d,0,0,d,0,0);scale=1}
new ResizeObserver(resize).observe(stage);resize();
function down(k,v){keys[k]=v}
document.querySelectorAll('[data-key]').forEach(b=>{let k=b.dataset.key;b.addEventListener('pointerdown',e=>{e.preventDefault();down(k,true);b.classList.add('down')});['pointerup','pointercancel','pointerleave'].forEach(ev=>b.addEventListener(ev,()=>{down(k,false);b.classList.remove('down')}))});
const stick=document.getElementById('stick'),knob=document.getElementById('knob');let stickPointer=null;function moveStick(e){const r=stick.getBoundingClientRect(),cx=r.left+r.width/2,cy=r.top+r.height/2;let dx=e.clientX-cx,dy=e.clientY-cy;const max=34,len=Math.hypot(dx,dy)||1;if(len>max){dx=dx/len*max;dy=dy/len*max}knob.style.transform='translate('+dx+'px,'+dy+'px)';keys.left=dx<-10;keys.right=dx>10;if(dy<-15)jumpQueued=true}stick.addEventListener('pointerdown',e=>{e.preventDefault();stickPointer=e.pointerId;stick.setPointerCapture(e.pointerId);moveStick(e)});stick.addEventListener('pointermove',e=>{if(e.pointerId===stickPointer)moveStick(e)});function releaseStick(e){if(e.pointerId!==stickPointer)return;stickPointer=null;keys.left=false;keys.right=false;knob.style.transform='translate(0,0)'}stick.addEventListener('pointerup',releaseStick);stick.addEventListener('pointercancel',releaseStick);
addEventListener('keydown',e=>{if(['ArrowLeft','a','ArrowRight','d',' ','ArrowUp','w'].includes(e.key))e.preventDefault();if(e.key==='ArrowLeft'||e.key==='a')down('left',true);if(e.key==='ArrowRight'||e.key==='d')down('right',true);if((e.key===' '||e.key==='ArrowUp'||e.key==='w')&&!keys._jumpHeld){jumpQueued=true;keys._jumpHeld=true}});
addEventListener('keyup',e=>{if(e.key==='ArrowLeft'||e.key==='a')down('left',false);if(e.key==='ArrowRight'||e.key==='d')down('right',false);if(e.key===' '||e.key==='ArrowUp'||e.key==='w')keys._jumpHeld=false});
document.getElementById('start').onclick=()=>{startMusic();started=true;document.getElementById('overlay').style.display='none'};
function rounded(x,y,w,h,r,c){ctx.fillStyle=c;ctx.beginPath();ctx.roundRect(x,y,w,h,r);ctx.fill()}
function drawBear(x,y,white=false){ctx.save();ctx.translate(x,y);const fur=white?'#f0eee9':'#a96f50',dark=white?'#593329':'#4b261f',cheek=white?'#ef9eaa':'#f1c35d';
ctx.fillStyle=dark;ctx.beginPath();ctx.arc(11,10,11,0,7);ctx.arc(35,10,11,0,7);ctx.fill();
ctx.fillStyle=fur;ctx.beginPath();ctx.roundRect(2,8,42,40,15);ctx.fill();ctx.beginPath();ctx.ellipse(23,49,22,16,0,0,7);ctx.fill();
ctx.fillStyle=dark;ctx.beginPath();ctx.arc(14,26,2.8,0,7);ctx.arc(32,26,2.8,0,7);ctx.fill();
ctx.strokeStyle=dark;ctx.lineWidth=2.5;ctx.lineCap='round';ctx.beginPath();ctx.moveTo(19,32);ctx.quadraticCurveTo(23,37,27,32);ctx.stroke();
ctx.fillStyle=cheek;ctx.beginPath();ctx.arc(8,34,5,0,7);ctx.arc(38,34,5,0,7);ctx.fill();
if(white){ctx.fillStyle=dark;ctx.beginPath();ctx.roundRect(7,43,32,5,3);ctx.fill()}else{ctx.fillStyle=dark;ctx.beginPath();ctx.arc(23,63,5,0,7);ctx.fill()}
ctx.restore()}
function draw(){if(!W||!H)return;ctx.clearRect(0,0,W,H);const groundY=H*.79,unit=Math.min(W/390,H/600),viewW=W/unit;cam=Math.max(0,Math.min(world.width-viewW,player.x- viewW*.34));
ctx.save();ctx.scale(unit,unit);ctx.translate(-cam,0);const gy=groundY/unit;
let bg=ctx.createLinearGradient(0,0,0,gy);bg.addColorStop(0,'#1a2631');bg.addColorStop(1,'#0a1018');ctx.fillStyle=bg;ctx.fillRect(cam,0,viewW,gy+100);
for(let i=0;i<22;i++){let x=i*105;ctx.fillStyle=i%2?'#202d35':'#26343a';ctx.beginPath();ctx.moveTo(x,gy-130-(i%4)*30);ctx.lineTo(x+35,gy-240-(i%3)*30);ctx.lineTo(x+95,gy-125);ctx.fill()}
for(let i=0;i<12;i++){let x=i*170+30;ctx.fillStyle='#101a20';ctx.fillRect(x,gy-170,8,170);ctx.fillStyle='#263a3a';ctx.beginPath();ctx.arc(x+4,gy-178,35,0,7);ctx.fill()}
ctx.fillStyle='#070a0f';ctx.fillRect(0,gy,world.width,120);
world.platforms.forEach(p=>{let y=gy+p.y;ctx.fillStyle='#252d31';ctx.fillRect(p.x,y,p.w,p.h);ctx.fillStyle='#59615b';ctx.fillRect(p.x,y,p.w,5);ctx.fillStyle='#141b20';for(let x=p.x+12;x<p.x+p.w;x+=34)ctx.fillRect(x,y+12,3,18)});
if(!world.switch.on){rounded(world.switch.x,gy+world.switch.y,22,18,5,'#b9874b');ctx.fillStyle='#f8d28d';ctx.fillRect(world.switch.x+9,gy+world.switch.y-7,4,12)}
if(!world.door.open){ctx.fillStyle='#4b3b31';ctx.fillRect(world.door.x,gy-145,38,145);ctx.fillStyle='#c79a5b';ctx.fillRect(world.door.x+6,gy-137,4,130)}
if(!world.bubu.rescued){drawBear(world.bubu.x,gy-105,true);ctx.fillStyle='#e9d7bc';ctx.font='12px system-ui';ctx.fillText('bubu',world.bubu.x-3,gy-116)}
drawBear(player.x,gy+player.y,false);
ctx.fillStyle='#d3b17b';ctx.font='10px system-ui';ctx.fillText('SWITCH',world.switch.x-6,gy+world.switch.y-16);
ctx.restore();
if(started&&!won&&!dead)update(unit,groundY/unit);
if(won||dead){document.getElementById('overlay').style.display='flex';document.querySelector('.panel h1').textContent=won?'bubu rescued!':'Try again';document.querySelector('.panel p').textContent=won?'You completed the first test stage.':'dudu fell into the darkness. Try the stage again.';document.getElementById('start').textContent=won?'PLAY AGAIN':'RETRY';document.getElementById('start').onclick=()=>{reset();started=true;document.getElementById('overlay').style.display='none'};won=false;dead=false}
requestAnimationFrame(draw)}
function update(unit,gy){frame++;let oldY=player.y;const jumpPressed=jumpQueued;jumpQueued=false;player.vx=(keys.right?3.1:0)-(keys.left?3.1:0);if(player.vx)player.face=Math.sign(player.vx);if(jumpPressed&&player.grounded){player.vy=-9.4;player.grounded=false}player.vy=Math.min(11,player.vy+.43);player.x+=player.vx;player.y+=player.vy;player.x=Math.max(0,Math.min(world.width-player.w,player.x));player.grounded=false;
const feet=player.y+player.h;for(const p of world.platforms){let top=p.y;if(player.x+player.w>p.x&&player.x<p.x+p.w&&oldY+player.h<=top+5&&feet>=top&&player.vy>=0){player.y=top-player.h;player.vy=0;player.grounded=true}}
if(player.y>190){lives--;document.getElementById('lives').textContent=lives;if(lives<=0)dead=true;else resetPlayer()}
if(Math.abs(player.x-world.switch.x)<35&&!world.switch.on&&player.grounded&&Math.abs((player.y+player.h)-world.switch.y)<40){world.switch.on=true;world.door.open=true;document.getElementById('hint').textContent='The old gate is open. Reach bubu!'}
if(world.door.open&&player.x>world.bubu.x-55&&player.x<world.bubu.x+55){world.bubu.rescued=true;won=true}
}
function resetPlayer(){player.x=90;player.y=-76;player.vx=0;player.vy=0}
function reset(){lives=3;document.getElementById('lives').textContent=lives;world.switch.on=false;world.door.open=false;world.bubu.rescued=false;document.getElementById('hint').textContent='Find the switch. Open the way to bubu.';resetPlayer()}
requestAnimationFrame(draw);
})();
</script></body></html>
