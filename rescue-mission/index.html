<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#10131b"><title>Bubu & Dudu: Rescue Mission — Test</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#0b0e15;color:#f4f0e8;font-family:system-ui,-apple-system,Segoe UI,sans-serif;touch-action:none}
#app{height:100dvh;display:flex;flex-direction:column;background:radial-gradient(ellipse at 50% 25%,#29313a 0,#111720 48%,#080b11 100%)}
header{height:58px;flex:none;display:flex;align-items:center;justify-content:space-between;padding:0 15px;border-bottom:1px solid #ffffff18;background:#0b0e15bb}
.brand{font-weight:800;font-size:13px;letter-spacing:.08em}.brand small{display:block;color:#aab1bd;font-size:9px;font-weight:500;letter-spacing:.2em}
#hud{display:flex;gap:12px;font-size:11px;color:#d7dbe1}#hud b{color:#f4d28b}
#stage{position:relative;flex:1;min-height:0;overflow:hidden}
canvas{width:100%;height:100%;display:block}
#hint{position:absolute;left:50%;top:12px;transform:translateX(-50%);background:#0a0d14b8;border:1px solid #ffffff22;border-radius:20px;padding:7px 12px;font-size:10px;color:#d7dbe1;white-space:nowrap;pointer-events:none}
#controls{height:132px;flex:none;display:flex;justify-content:center;align-items:center;padding:8px 16px calc(12px + env(safe-area-inset-bottom));background:linear-gradient(#10151dcc,#080b11);border-top:1px solid #ffffff18}
#stick{width:116px;height:116px;border-radius:50%;border:2px solid #ffffff55;background:radial-gradient(circle,#34414d,#151c25);position:relative;touch-action:none;box-shadow:0 5px 18px #0009}#knob{position:absolute;width:48px;height:48px;left:32px;top:32px;border-radius:50%;background:linear-gradient(145deg,#c6d0d7,#64727e);border:2px solid #ffffff99;pointer-events:none}
#overlay{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;background:#080b11c9;backdrop-filter:blur(5px);padding:24px}
.panel{width:min(340px,100%);padding:24px 20px;border:1px solid #ffffff28;border-radius:22px;background:linear-gradient(150deg,#252d38,#111720);text-align:center;box-shadow:0 20px 70px #000a}
.panel h1{font-size:22px;line-height:1.15;margin:0 0 10px}.panel p{font-size:12px;line-height:1.6;color:#c1c8d1;margin:0 0 18px}
.primary,.secondary{border:0;border-radius:12px;padding:13px 18px;font-weight:900;letter-spacing:.05em}.primary{background:linear-gradient(120deg,#d4ad72,#9c7544);color:#15120e}.secondary{margin-top:9px;background:#354352;color:#f4f0e8;border:1px solid #ffffff35}
.note{font-size:10px;color:#9aa5b2;margin-top:13px}
@media(min-width:700px){#app{max-width:460px;margin:auto;border-left:1px solid #ffffff18;border-right:1px solid #ffffff18}}
</style></head>
<body><div id="app">
<header><div class="brand">BUBU & DUDU <small>RESCUE MISSION · TEST BUILD</small></div><div id="hud"><span>LEVEL <b>01 / 10</b></span><span>❤ <b id="lives">3</b></span><button id="audio">♫ SOUND ON</button></div></header>
<main id="stage"><canvas id="game"></canvas><div id="hint">Find the switch. Open the way to bubu.</div>
<div id="overlay"><div class="panel"><h1>Rescue Mission</h1><p>dudu has reached the abandoned forest station. Find the hidden switch, avoid the broken floor and rescue bubu.</p><button class="primary" id="start">START LEVEL 1</button><br><button class="secondary" id="wolfStart">PLAY WOLF ESCAPE · LEVEL 04</button><div class="note">Prototype · Mobile controls · No purchases</div></div></div></main>
<section id="controls"><div id="stick" role="button" aria-label="Move: drag left or right; jump: push joystick upward"><div id="knob"></div></div></section>
</div>
<script>
(()=> {
const canvas=document.getElementById('game'),ctx=canvas.getContext('2d'),stage=document.getElementById('stage');
let W=0,H=0,scale=1,started=false,won=false,dead=false,lives=3,cam=0,frame=0,wolfMission=false,caught=false,caughtAt=0,lastStepAt=0,lastGrowlAt=0;
const keys={left:false,right:false};let jumpQueued=false,jumpQueuedAt=0,lastGroundedAt=0;
function queueJump(){jumpQueued=true;jumpQueuedAt=performance.now()}
let audioCtx=null,audioOn=false,audioTimer=null;
function tone(freq,dur,vol=.08,type='sine',endFreq=freq){if(!audioOn||!audioCtx)return;const o=audioCtx.createOscillator(),g=audioCtx.createGain(),t=audioCtx.currentTime;o.type=type;o.frequency.setValueAtTime(freq,t);o.frequency.exponentialRampToValueAtTime(Math.max(1,endFreq),t+dur);g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(vol,t+.015);g.gain.exponentialRampToValueAtTime(.0001,t+dur);o.connect(g);g.connect(audioCtx.destination);o.start(t);o.stop(t+dur+.03)}
function footstep(){tone(72,.075,.055,'triangle',48)}
function wolfFootstep(){tone(52,.085,.045,'triangle',31)}
function jumpSound(){tone(220,.16,.07,'sine',420)}
function landSound(){tone(95,.10,.08,'triangle',55)}
function wolfGrowl(){tone(95,.48,.10,'sawtooth',42)}
function caughtSound(){tone(180,.65,.12,'sawtooth',38);setTimeout(()=>tone(65,.5,.10,'triangle',28),180)}
function startMusic(){if(audioOn)return;const AC=window.AudioContext||window.webkitAudioContext;if(!AC)return;audioCtx=new AC();audioCtx.resume();audioOn=true;document.getElementById('audio').textContent='♫ SOUND ON';const master=audioCtx.createGain();master.gain.value=.30;master.connect(audioCtx.destination);const low=audioCtx.createBiquadFilter();low.type='lowpass';low.frequency.value=850;low.connect(master);function note(freq,dur,when,vol){const o=audioCtx.createOscillator(),g=audioCtx.createGain();o.type='triangle';o.frequency.setValueAtTime(freq,when);g.gain.setValueAtTime(.0001,when);g.gain.linearRampToValueAtTime(vol,when+.8);g.gain.exponentialRampToValueAtTime(.0001,when+dur);o.connect(g);g.connect(low);o.start(when);o.stop(when+dur+.1)}const seq=[110,164.81,130.81,196,98,146.83,123.47,185];let n=0;function phrase(){if(!audioOn)return;let t=audioCtx.currentTime;note(seq[n%8],5,t,.25);note(seq[(n+2)%8]*2,3,t+1.4,.075);note(seq[(n+4)%8]*1.5,4,t+2.8,.06);n++;audioTimer=setTimeout(phrase,5200)}phrase()}
document.getElementById('audio').onclick=()=>{if(!audioOn){startMusic()}else{audioOn=false;clearTimeout(audioTimer);if(audioCtx)audioCtx.suspend();document.getElementById('audio').textContent='♫ SOUND OFF'}};
const world={width:1900,ground:0,platforms:[{x:0,y:0,w:430,h:70},{x:520,y:0,w:360,h:70},{x:1000,y:0,w:900,h:70},{x:310,y:-105,w:130,h:18},{x:650,y:-145,w:150,h:18},{x:1120,y:-105,w:180,h:18}],switch:{x:360,y:-35,on:false},door:{x:1510,y:-145,open:false},bubu:{x:1760,y:-74,rescued:false}};
const player={x:90,y:-76,vx:0,vy:0,w:42,h:58,grounded:false,face:1};
const wolves=[{x:540,vx:0,speed:1.75,stepAt:0},{x:960,vx:0,speed:2.05,stepAt:0},{x:1370,vx:0,speed:2.35,stepAt:0}];
function resize(){const r=stage.getBoundingClientRect();W=r.width;H=r.height;const d=Math.min(devicePixelRatio||1,2);canvas.width=Math.floor(W*d);canvas.height=Math.floor(H*d);ctx.setTransform(d,0,0,d,0,0);scale=1}
new ResizeObserver(resize).observe(stage);resize();
function down(k,v){keys[k]=v}
document.querySelectorAll('[data-key]').forEach(b=>{let k=b.dataset.key;b.addEventListener('pointerdown',e=>{e.preventDefault();down(k,true);b.classList.add('down')});['pointerup','pointercancel','pointerleave'].forEach(ev=>b.addEventListener(ev,()=>{down(k,false);b.classList.remove('down')}))});
const stick=document.getElementById('stick'),knob=document.getElementById('knob');let stickPointer=null;function moveStick(e){const r=stick.getBoundingClientRect(),cx=r.left+r.width/2,cy=r.top+r.height/2;let dx=e.clientX-cx,dy=e.clientY-cy;const max=34,len=Math.hypot(dx,dy)||1;if(len>max){dx=dx/len*max;dy=dy/len*max}knob.style.transform='translate('+dx+'px,'+dy+'px)';keys.left=dx<-10;keys.right=dx>10;if(dy<-15)queueJump()}stick.addEventListener('pointerdown',e=>{e.preventDefault();stickPointer=e.pointerId;stick.setPointerCapture(e.pointerId);moveStick(e)});stick.addEventListener('pointermove',e=>{if(e.pointerId===stickPointer)moveStick(e)});function releaseStick(e){if(e.pointerId!==stickPointer)return;stickPointer=null;keys.left=false;keys.right=false;knob.style.transform='translate(0,0)'}stick.addEventListener('pointerup',releaseStick);stick.addEventListener('pointercancel',releaseStick);
addEventListener('keydown',e=>{if(['ArrowLeft','a','ArrowRight','d',' ','ArrowUp','w'].includes(e.key))e.preventDefault();if(e.key==='ArrowLeft'||e.key==='a')down('left',true);if(e.key==='ArrowRight'||e.key==='d')down('right',true);if((e.key===' '||e.key==='ArrowUp'||e.key==='w')&&!keys._jumpHeld){queueJump();keys._jumpHeld=true}});
addEventListener('keyup',e=>{if(e.key==='ArrowLeft'||e.key==='a')down('left',false);if(e.key==='ArrowRight'||e.key==='d')down('right',false);if(e.key===' '||e.key==='ArrowUp'||e.key==='w')keys._jumpHeld=false});
document.getElementById('start').onclick=()=>{wolfMission=false;startMusic();started=true;document.getElementById('hud').querySelector('span').innerHTML='LEVEL <b>01 / 10</b>';document.getElementById('hint').textContent='Find the switch. Open the way to bubu.';document.getElementById('overlay').style.display='none'};
document.getElementById('wolfStart').onclick=()=>{wolfMission=true;startMusic();reset();world.switch.on=true;world.door.open=true;started=true;document.getElementById('hud').querySelector('span').innerHTML='LEVEL <b>04 / 10 · WOLF ESCAPE</b>';document.getElementById('hint').textContent='RUN! The wild wolves are chasing dudu. Reach bubu!';document.getElementById('overlay').style.display='none'};
function rounded(x,y,w,h,r,c){ctx.fillStyle=c;ctx.beginPath();ctx.roundRect(x,y,w,h,r);ctx.fill()}
function drawBear(x,y,white=false){ctx.save();ctx.translate(x,y);const fur=white?'#f0eee9':'#a96f50',dark=white?'#593329':'#4b261f',cheek=white?'#ef9eaa':'#f1c35d';
ctx.fillStyle=dark;ctx.beginPath();ctx.arc(11,10,11,0,7);ctx.arc(35,10,11,0,7);ctx.fill();
ctx.fillStyle=fur;ctx.beginPath();ctx.roundRect(2,8,42,40,15);ctx.fill();ctx.beginPath();ctx.ellipse(23,49,22,16,0,0,7);ctx.fill();
ctx.fillStyle=dark;ctx.beginPath();ctx.arc(14,26,2.8,0,7);ctx.arc(32,26,2.8,0,7);ctx.fill();
ctx.strokeStyle=dark;ctx.lineWidth=2.5;ctx.lineCap='round';ctx.beginPath();ctx.moveTo(19,32);ctx.quadraticCurveTo(23,37,27,32);ctx.stroke();
ctx.fillStyle=cheek;ctx.beginPath();ctx.arc(8,34,5,0,7);ctx.arc(38,34,5,0,7);ctx.fill();
if(white){ctx.fillStyle=dark;ctx.beginPath();ctx.roundRect(7,43,32,5,3);ctx.fill()}else{ctx.fillStyle=dark;ctx.beginPath();ctx.arc(23,63,5,0,7);ctx.fill()}
ctx.restore()}
function drawWolf(x,gy){ctx.save();ctx.translate(x,gy-58);ctx.fillStyle='#353b42';ctx.beginPath();ctx.ellipse(23,36,27,17,-.08,0,Math.PI*2);ctx.fill();ctx.beginPath();ctx.moveTo(4,28);ctx.lineTo(-1,7);ctx.lineTo(15,19);ctx.moveTo(30,19);ctx.lineTo(47,4);ctx.lineTo(44,29);ctx.fill();ctx.fillStyle='#59616a';ctx.beginPath();ctx.ellipse(48,29,15,11,0,0,Math.PI*2);ctx.fill();ctx.fillStyle='#d9b26e';ctx.beginPath();ctx.arc(52,26,2.3,0,Math.PI*2);ctx.fill();ctx.fillStyle='#20252b';ctx.fillRect(8,47,7,12);ctx.fillRect(31,47,7,12);ctx.restore()}
function draw(){if(!W||!H)return;ctx.clearRect(0,0,W,H);const groundY=H*.79,unit=Math.min(W/390,H/600),viewW=W/unit;cam=Math.max(0,Math.min(world.width-viewW,player.x- viewW*.34));
ctx.save();ctx.scale(unit,unit);ctx.translate(-cam,0);const gy=groundY/unit;
let bg=ctx.createLinearGradient(0,0,0,gy);bg.addColorStop(0,'#1a2631');bg.addColorStop(1,'#0a1018');ctx.fillStyle=bg;ctx.fillRect(cam,0,viewW,gy+100);
// Layered mountain silhouettes create cinematic depth.
for(let layer=0;layer<3;layer++){for(let i=-2;i<Math.ceil(viewW/185)+3;i++){let x=cam+i*185,peak=gy-145-layer*48-((i*17+layer*23)%5)*19;ctx.fillStyle=['#18262d','#1c2b31','#24363a'][layer];ctx.beginPath();ctx.moveTo(x,gy-25);ctx.lineTo(x+72,peak);ctx.lineTo(x+185,gy-20);ctx.closePath();ctx.fill()}}
// Cold moon glow and narrow shafts of light.
const moon=ctx.createRadialGradient(cam+viewW*.72,gy*.18,4,cam+viewW*.72,gy*.18,gy*.7);moon.addColorStop(0,'#b7c7c344');moon.addColorStop(1,'#b7c7c300');ctx.fillStyle=moon;ctx.fillRect(cam,0,viewW,gy);
ctx.save();ctx.globalAlpha=.075;for(let i=0;i<5;i++){let x=cam+viewW*(.12+i*.19);ctx.fillStyle='#c4d5d0';ctx.beginPath();ctx.moveTo(x,0);ctx.lineTo(x+32,0);ctx.lineTo(x+145,gy);ctx.lineTo(x+82,gy);ctx.closePath();ctx.fill()}ctx.restore();
// Layered forest silhouettes with trunks, branches and rounded canopies.
for(let i=-2;i<Math.ceil(viewW/105)+3;i++){let x=cam+i*105+((i*29)%33),height=115+((i*37)%95);ctx.fillStyle='#101a20';ctx.fillRect(x,gy-height,9,height+4);ctx.fillStyle=i%2?'#203438':'#263d3d';for(let b=0;b<3;b++){ctx.beginPath();ctx.arc(x+4,gy-height-12-b*21,30-b*4,0,Math.PI*2);ctx.fill()}ctx.strokeStyle='#111d21';ctx.lineWidth=5;ctx.beginPath();ctx.moveTo(x+4,gy-height+22);ctx.lineTo(x-18,gy-height-12);ctx.moveTo(x+5,gy-height+4);ctx.lineTo(x+27,gy-height-25);ctx.stroke()}
ctx.fillStyle='#070a0f';ctx.fillRect(0,gy,world.width,120);
// Ground texture, scattered stones and a low bank of drifting fog.
for(let i=0;i<Math.ceil(viewW/48)+3;i++){let x=cam+i*48;ctx.fillStyle=i%2?'#161e22':'#1b2427';ctx.beginPath();ctx.ellipse(x,gy+10,18+(i%3)*4,5,0,0,Math.PI*2);ctx.fill()}
for(let layer=0;layer<3;layer++){ctx.save();ctx.globalAlpha=.11-layer*.02;ctx.fillStyle='#a8b8b5';ctx.beginPath();ctx.ellipse(cam+viewW*(.22+layer*.28),gy-18-layer*8,viewW*.42,13+layer*4,0,0,Math.PI*2);ctx.fill();ctx.restore()}
world.platforms.forEach(p=>{let y=gy+p.y;ctx.fillStyle='#252d31';ctx.fillRect(p.x,y,p.w,p.h);ctx.fillStyle='#59615b';ctx.fillRect(p.x,y,p.w,5);ctx.fillStyle='#141b20';for(let x=p.x+12;x<p.x+p.w;x+=34)ctx.fillRect(x,y+12,3,18)});
if(!world.switch.on){rounded(world.switch.x,gy+world.switch.y,22,18,5,'#b9874b');ctx.fillStyle='#f8d28d';ctx.fillRect(world.switch.x+9,gy+world.switch.y-7,4,12)}
if(!world.door.open){ctx.fillStyle='#4b3b31';ctx.fillRect(world.door.x,gy-145,38,145);ctx.fillStyle='#c79a5b';ctx.fillRect(world.door.x+6,gy-137,4,130)}
if(!world.bubu.rescued){drawBear(world.bubu.x,gy-105,true);ctx.fillStyle='#e9d7bc';ctx.font='12px system-ui';ctx.fillText('bubu',world.bubu.x-3,gy-116)}
if(wolfMission)wolves.forEach(w=>drawWolf(w.x,gy));
drawBear(player.x,gy+player.y,false);
if(caught){drawWolf(player.x-12,gy);ctx.fillStyle='#f6d38e';ctx.font='bold 18px system-ui';ctx.fillText('CHOMP!',player.x-5,gy-105)}
ctx.fillStyle='#d3b17b';ctx.font='10px system-ui';ctx.fillText('SWITCH',world.switch.x-6,gy+world.switch.y-16);
ctx.restore();
if(started&&!won&&!dead)update(unit,groundY/unit);
if(won||dead){document.getElementById('overlay').style.display='flex';document.querySelector('.panel h1').textContent=won?'bubu rescued!':(wolfMission?'The wolves caught dudu!':'Try again');document.querySelector('.panel p').textContent=won?'You completed the rescue mission.':(wolfMission?'The pack caught up. Take a breath and try the escape again.':'dudu fell into the darkness. Try the stage again.');document.getElementById('start').textContent=won?'PLAY AGAIN':'RETRY';document.getElementById('start').onclick=()=>{reset();if(wolfMission){world.switch.on=true;world.door.open=true;document.getElementById('hint').textContent='RUN! The wild wolves are chasing dudu. Reach bubu!'}started=true;document.getElementById('overlay').style.display='none'};won=false;dead=false}
requestAnimationFrame(draw)}
function update(unit,gy){frame++;const now=performance.now();if(caught){if(now-caughtAt>1350)dead=true;return}let oldY=player.y,wasGrounded=player.grounded;if(player.grounded)lastGroundedAt=now;const jumpPressed=jumpQueued&&now-jumpQueuedAt<180;if(jumpQueued&&!jumpPressed)jumpQueued=false;const input=(keys.right?1:0)-(keys.left?1:0);const accel=player.grounded?.72:.42;if(input){player.vx=Math.max(-3.7,Math.min(3.7,player.vx+input*accel));player.face=Math.sign(input)}else{player.vx*=player.grounded?.72:.94;if(Math.abs(player.vx)<.08)player.vx=0}if(jumpPressed&&(player.grounded||now-lastGroundedAt<130)){player.vy=-9.6;player.grounded=false;jumpQueued=false;lastGroundedAt=0;jumpSound()}player.vy=Math.min(11,player.vy+.43);player.x+=player.vx;player.y+=player.vy;player.x=Math.max(0,Math.min(world.width-player.w,player.x));player.grounded=false;
const feet=player.y+player.h;for(const p of world.platforms){let top=p.y;if(player.x+player.w>p.x&&player.x<p.x+p.w&&oldY+player.h<=top+5&&feet>=top&&player.vy>=0){player.y=top-player.h;player.vy=0;player.grounded=true}}
if(player.y>190){lives--;document.getElementById('lives').textContent=lives;if(lives<=0)dead=true;else resetPlayer()}
if(!wasGrounded&&player.grounded)landSound();
if(player.grounded&&Math.abs(player.vx)>.55&&now-lastStepAt>285){footstep();lastStepAt=now}
if(wolfMission){for(const w of wolves){const dx=player.x-w.x;if(Math.abs(dx)<560){w.vx=Math.sign(dx)*w.speed;if(now-w.stepAt>340){wolfFootstep();w.stepAt=now}if(Math.abs(dx)<42&&Math.abs(player.y+player.h)<28){caught=true;caughtAt=now;player.vx=0;player.vy=0;caughtSound();break}}else{w.vx*=.92}w.x+=w.vx;if(w.x<20)w.x=20;if(w.x>world.width-50)w.x=world.width-50}if(now-lastGrowlAt>5200){wolfGrowl();lastGrowlAt=now}}
if(Math.abs(player.x-world.switch.x)<35&&!world.switch.on&&player.grounded&&Math.abs((player.y+player.h)-world.switch.y)<40){world.switch.on=true;world.door.open=true;document.getElementById('hint').textContent='The old gate is open. Reach bubu!'}
if(world.door.open&&player.x>world.bubu.x-55&&player.x<world.bubu.x+55){world.bubu.rescued=true;won=true}
}
function resetPlayer(){player.x=90;player.y=-76;player.vx=0;player.vy=0;player.grounded=false;wolves[0].x=540;wolves[1].x=960;wolves[2].x=1370;wolves.forEach(w=>w.vx=0);caught=false;}
function reset(){lives=3;document.getElementById('lives').textContent=lives;world.switch.on=wolfMission;world.door.open=wolfMission;world.bubu.rescued=false;caught=false;lastGrowlAt=performance.now();document.getElementById('hint').textContent=wolfMission?'RUN! The wild wolves are chasing dudu. Reach bubu!':'Find the switch. Open the way to bubu.';resetPlayer()}
requestAnimationFrame(draw);
})();
</script></body></html>
